<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ActivaMente</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Rubik:ital,wght@0,400;0,500;0,700;1,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFBF7;--card:#fff;--ink:#3B2623;--mut:#5C4540;--line:#EEDDD6;--acc:#A44F40;--c1:#FDE9E3;--c3:#F9DCCF;--yel:#FFF1BF;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 20px/1.6 Inter,system-ui,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom,0px));overflow-x:hidden}
h1,h2,h3,.brand{font-family:Rubik,system-ui,sans-serif;margin:0}
a:focus-visible,button:focus-visible{outline:4px solid var(--acc);outline-offset:3px}
header{padding:14px 16px 4px}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;font-size:25px;color:var(--ink);text-decoration:none}
.brand i{width:44px;height:44px;border-radius:14px;background:var(--acc);color:#fff;display:grid;place-items:center;font-style:normal}
nav{display:flex;gap:10px;overflow-x:auto;padding:14px 16px 6px;margin:0 -16px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:0 0 auto;white-space:nowrap;color:var(--ink);text-decoration:none;font-weight:700;font-size:18px;padding:12px 22px;border:2px solid var(--line);border-radius:999px;background:var(--card)}
nav a.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1040px;margin:0 auto;padding:16px 16px 24px;overflow-x:clip}
.here{display:inline-block;background:var(--yel);color:var(--ink);font:700 16px Inter,sans-serif;padding:7px 16px;border-radius:999px}
h1{font-size:34px;line-height:1.15;margin:14px 0;font-weight:700}
h1 em{font-style:italic;color:var(--acc);background:linear-gradient(transparent 68%,var(--yel) 68%)}
.lead{font-size:20px;color:var(--mut);margin:0 0 20px}
.how{background:var(--card);border:3px solid #F3D66B;border-radius:22px;padding:16px 18px;margin:20px 0}
.how b{display:block;font:700 20px Rubik,sans-serif;margin-bottom:4px}
.how ol{margin:6px 0 0;padding-left:26px}.how li{margin:6px 0}
.split{display:grid;gap:26px}
.ph{position:relative}
.ph img{width:100%;display:block;border-radius:28px;aspect-ratio:4/3;object-fit:cover}
.ph.tall img{aspect-ratio:1/1}
.ph:before{content:"";position:absolute;width:80px;height:80px;border-radius:50%;background:var(--yel);top:-14px;right:-8px;z-index:-1}
.fl{position:absolute;border-radius:16px;padding:9px 16px;font:700 17px Rubik,sans-serif;box-shadow:0 6px 18px rgba(59,38,35,.15)}
.fl.a{left:12px;bottom:14px;background:var(--yel);color:var(--ink)}.fl.b{right:12px;top:14px;background:var(--c3);color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr;gap:16px;margin:24px 0}
.card{border-radius:26px;padding:22px;color:var(--ink);text-decoration:none;display:block;background:var(--card);border:2px solid var(--line)}
.grid .card:nth-child(4n+1){background:var(--c1);border-color:transparent}
.grid .card:nth-child(4n+2){background:var(--yel);border-color:transparent}
.grid .card:nth-child(4n+3){background:var(--c3);border-color:transparent}
.num{font:700 18px Rubik,sans-serif;width:46px;height:46px;border-radius:50%;background:#fff;color:var(--acc);display:grid;place-items:center;margin-bottom:10px}
.card h3{font-size:24px;margin:4px 0 8px;font-weight:700;line-height:1.25}
.card p{margin:0;font-size:19px;color:var(--ink)}
.tag{margin-top:14px!important;font-weight:700}
.more{display:inline-block;margin-top:14px;font-weight:700;color:var(--acc);text-decoration:underline;text-underline-offset:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;background:var(--acc);color:#fff;padding:14px 24px;border-radius:999px;text-decoration:none;font:700 20px Inter,sans-serif;border:2px solid var(--acc);cursor:pointer;text-align:center;line-height:1.2}
.btn.o{background:#fff;color:var(--ink);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0 26px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:10px 20px;font-weight:700}
.note{background:var(--yel);color:var(--ink);border-radius:22px;padding:16px 20px;margin:22px 0}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:#fff;border-top:2px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.bar .btn{width:auto;flex:1 1 40%;min-height:56px;padding:12px;font-size:19px}
.bar .nx{flex:1 1 100%}
footer{text-align:center;color:var(--mut);padding:10px 20px 20px}footer b{display:block;font:700 20px Rubik,sans-serif;color:var(--ink)}
@media(min-width:700px){h1{font-size:52px}.grid{grid-template-columns:repeat(2,1fr)}.btn{display:inline-flex;width:auto}.bar .btn{flex:0 1 240px}.bar .nx{flex:0 1 320px}.bar{flex-wrap:nowrap}header,main{padding-left:5vw;padding-right:5vw}nav{margin:0;padding-left:0}}
@media(min-width:900px){.split{grid-template-columns:1.1fr .9fr;align-items:center;gap:40px}.ph.tall img{aspect-ratio:4/5}.grid{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}}

/* Diseño adaptable: celular, tablet y escritorio */
:root{--page-width:1120px}
html{scroll-behavior:auto}
body{font-size:clamp(17px,1.65vw,20px);line-height:1.55;padding-bottom:calc(198px + env(safe-area-inset-bottom,0px))}
header{max-width:var(--page-width);margin:0 auto;padding:18px clamp(16px,3vw,32px) 0}
main{max-width:var(--page-width);padding:clamp(18px,3vw,32px) clamp(16px,3vw,32px) 30px;min-width:0}
nav{margin:0;display:flex;gap:8px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x proximity;padding:14px 0 12px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
nav a{scroll-snap-align:start;font-size:clamp(15px,1.3vw,17px);padding:10px 17px;min-height:46px;display:inline-flex;align-items:center}
nav a:active{transform:translateY(1px)}
h1{font-size:clamp(32px,5vw,56px);overflow-wrap:break-word}
.lead{font-size:clamp(18px,2vw,21px)}
.grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));align-items:stretch;gap:clamp(14px,2vw,20px)}
.card{min-width:0;padding:clamp(18px,2.3vw,24px);overflow-wrap:anywhere}
.card h3{font-size:clamp(21px,2vw,25px)}
.card p{font-size:clamp(17px,1.65vw,19px)}
.split{grid-template-columns:minmax(0,1fr);align-items:start}
.ph{min-width:0;isolation:isolate}.ph img{max-height:480px}
.how{font-size:clamp(16px,1.55vw,19px)}
.btn{max-width:100%;font-size:clamp(17px,1.8vw,20px);overflow-wrap:anywhere}
.chips{gap:8px}.chip{font-size:clamp(16px,1.65vw,19px);padding:9px 16px}
.app-list{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:flex-start}
.app-item{display:flex;flex-direction:column;align-items:center;text-align:center;gap:7px;flex:1 1 64px;min-width:64px;max-width:110px;font:700 14px/1.3 Rubik,system-ui,sans-serif;color:var(--ink)}
.app-icon{width:66px;height:66px;max-width:100%;background:#fff;border:1px solid rgba(59,38,35,.12);border-radius:18px;display:grid;place-items:center;overflow:hidden;box-shadow:0 3px 12px rgba(59,38,35,.08)}
.app-icon img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
.video-section {
  display: grid;
  gap: clamp(16px, 3vw, 32px);
  margin-block: 24px;
  padding: clamp(12px, 3vw, 32px);
  background: var(--card);
  border: 2px solid var(--line);
  border-radius: 24px;
}
.video-heading { font-size: clamp(23px, 3vw, 34px); line-height: 1.2; }
.video-frame {
  position: relative;
  inline-size: 100%;
  max-inline-size: clamp(13rem, calc((100svh - 7rem) * 9 / 16), 25rem);
  aspect-ratio: 9 / 16;
  justify-self: center;
  background: var(--ink);
  border-radius: 16px;
}
.video-frame :is(img, iframe, video) {
  position: absolute;
  inset: 0;
  display: block;
  inline-size: 100%;
  block-size: 100%;
  border: 0;
  border-radius: inherit;
}
.video-frame :is(iframe, video):focus-visible { outline: 4px solid var(--acc); outline-offset: 3px; }
.video-play {
  position: absolute;
  z-index: 1;
  inset-block-start: 20%;
  inset-inline: 0;
  inline-size: max-content;
  max-inline-size: calc(100% - 24px);
  margin-inline: auto;
  box-shadow: 0 3px 16px rgb(0 0 0 / 35%);
}
.video-section .how { margin: 0; }
.video-link { display: inline-flex; align-items: center; min-block-size: 44px; margin-block-start: 8px; color: var(--acc); }
.video-status { margin-block: 12px 0; color: var(--ink); }
.video-status:empty { margin: 0; }
body:has(.video-section) { padding-bottom: env(safe-area-inset-bottom, 0px); }
body:has(.video-section) .bar { position: static; }

@media (min-width: 700px) {
  .video-section { grid-template-columns: minmax(0, .95fr) minmax(0, 1.05fr); align-items: start; }
  .video-heading { grid-column: 1 / -1; }
}
.bar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -5px 22px rgba(59,38,35,.07)}
.bar[hidden]{display:none}
.bar .btn{width:100%;min-width:0;min-height:50px;padding:10px 8px;font-size:clamp(15px,3.8vw,18px);flex:unset}
.bar .nx{grid-column:1/-1;flex:unset}
footer{padding:24px 16px 22px}
@media(min-width:700px){
  body{padding-bottom:calc(100px + env(safe-area-inset-bottom,0px))}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bar{display:flex;justify-content:center;flex-wrap:nowrap;gap:12px}
  .bar .btn{width:auto;flex:0 1 205px;font-size:17px;min-height:54px;padding:11px 18px}
  .bar .nx{flex:0 1 340px}
  .app-icon{width:72px;height:72px}
}
@media(min-width:900px){
  .split{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;gap:40px}
  .grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ph.tall img{aspect-ratio:4/5}
}
@media(max-width:370px){
  .brand{font-size:22px}.brand i{width:40px;height:40px}
  .app-list{gap:7px}.app-item{font-size:12px;min-width:58px}.app-icon{width:54px;height:54px}
  .bar .btn{font-size:15px}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Seguimiento: tarjeta en la misma línea visual que el resto de ActivaMente */
.followup-section{
  display:grid;
  grid-template-columns:110px minmax(0,1fr);
  align-items:center;
  gap:clamp(18px,3vw,30px);
  padding:clamp(20px,3vw,34px);
  margin:24px 0;
  background:var(--c1);
  border:2px solid var(--line);
  border-radius:26px;
}
.followup-app{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0;text-align:center;font:700 15px/1.3 Rubik,system-ui,sans-serif}
.followup-icon{width:94px;height:94px;display:grid;place-items:center;background:#fff;border:1px solid rgba(59,38,35,.1);border-radius:22px;box-shadow:0 3px 12px rgba(59,38,35,.09)}
.followup-icon svg{display:block;width:67px;height:67px}
.followup-content{min-width:0}
.followup-content h2{font-size:clamp(24px,3vw,32px);line-height:1.2;margin:0 0 12px}
.followup-content p{font-size:clamp(17px,1.65vw,19px);margin:0 0 16px;color:var(--mut)}
.followup-content .btn{margin:4px 0 0}
.followup-content .followup-help{font-size:15px;margin:12px 0 0}
@media(max-width:520px){
  .followup-section{grid-template-columns:minmax(0,1fr)}
  .followup-app{flex-direction:row;justify-content:flex-start;text-align:left}
  .followup-icon{width:70px;height:70px;border-radius:18px}
  .followup-icon svg{width:52px;height:52px}
  .followup-content .btn{width:100%}
}

/* Guía descargable: complemento del videotutorial de compras */
.guide-resource {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  align-items: center;
  gap: clamp(16px, 2.5vw, 26px);
  margin: 0 0 28px;
  padding: clamp(20px, 3vw, 32px);
  background: var(--yel);
  border: 2px solid #F3D66B;
  border-radius: 26px;
}
.guide-icon {
  display: grid;
  place-items: center;
  width: 78px;
  height: 78px;
  flex-shrink: 0;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 3px 12px rgba(59, 38, 35, .08);
}
.guide-icon svg { width: 47px; height: 55px; display: block; }
.guide-content { min-width: 0; }
.guide-content h2 {
  font-size: clamp(23px, 3vw, 30px);
  line-height: 1.2;
  margin: 0 0 10px;
}
.guide-content p {
  color: var(--mut);
  font-size: clamp(17px, 1.65vw, 19px);
  margin: 0 0 18px;
}
.guide-content .btn { width: 100%; }
.guide-content .guide-hint { font-size: 15px; margin: 12px 0 0; }
@media (min-width: 700px) {
  .guide-resource { grid-template-columns: 92px minmax(0, 1fr); }
  .guide-content .btn { width: auto; }
}

</style>
</head>

function loadTutorialPlayer(event) {
  const button = event.currentTarget;
  const frame = button.closest('.video-frame');
  const moveFocus = document.activeElement === button;

  if (location.protocol === 'file:') {
    const video = document.createElement('video');
    video.controls = true;
    video.playsInline = true;
    video.setAttribute('aria-labelledby', 'video-heading');
    video.src = './video_tecnologia.mp4';
    const status = frame.closest('.video-section').querySelector('.video-status');
    video.addEventListener('error', () => {
      status.textContent = 'El archivo local no está disponible. Puedes reproducir el video en YouTube.';
    }, { once: true });
    frame.replaceChildren(video);
    if (moveFocus) video.focus({ preventScroll: true });
    video.play().catch(() => {
      if (!video.error) status.textContent = 'Pulsa reproducir en los controles del video.';
    });
    return;
  }

  const iframe = document.createElement('iframe');
  iframe.title = 'Videotutorial de compras en YouTube';
  iframe.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  iframe.allowFullscreen = true;
  iframe.referrerPolicy = 'strict-origin-when-cross-origin';
  iframe.src = `https://www.youtube-nocookie.com/embed/${tutorialVideoId}?autoplay=1&playsinline=1&hl=es`;
  frame.replaceChildren(iframe);
  if (moveFocus) iframe.focus({ preventScroll: true });
}
